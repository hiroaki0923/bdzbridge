# XcodeGen definition for the iOS app. The project file itself is generated and not committed:
#   brew install xcodegen && cd app && xcodegen generate
#
# The app is called BD Bridge. The target is BDBridge without the space, so that the product, the scheme and
# the archive are one word on a command line; the space belongs to CFBundleDisplayName, which is what a
# reader sees.
name: BDBridge
options:
  bundleIdPrefix: jp.hiroaki
  # Every word in this app is Japanese, and it talks to recorders sold in Japan. Without this the project
  # takes Xcode's default of English, the built Info.plist says CFBundleDevelopmentRegion=en, and the App
  # Store lists the app's language as English -- which is not true of a single screen.
  developmentLanguage: ja
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  RecorderKit:
    path: RecorderKit

targets:
  BDBridge:
    type: application
    platform: iOS
    sources:
      - path: BDBridge
    dependencies:
      - package: RecorderKit
        product: RecorderKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.hiroaki.bdbridge
        MARKETING_VERSION: "0.1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Xcode's General tab reads the category from this build setting rather than from the Info.plist, and
        # shows None without it. With GENERATE_INFOPLIST_FILE off it changes nothing in the build, so the same
        # answer is written in both places; the category a shopper sees is the one set in App Store Connect.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM lives here and not above, because a build setting outranks an xcconfig:
    # Signing.xcconfig reads the gitignored Signing.local.xcconfig, which holds the team identifier.
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    info:
      path: BDBridge/Info.plist
      properties:
        CFBundleDisplayName: BD Bridge
        # Said outright as well as through the development region, so that what the store lists does not
        # depend on how a build setting resolves.
        CFBundleLocalizations:
          - ja
        # Xcode's General tab reads this, and the store wants a category too -- the one chosen in App Store
        # Connect is what a shopper sees; this is the same answer in the build.
        LSApplicationCategoryType: public.app-category.entertainment
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The recorder is reached over plain HTTP on the LAN, and nowhere else.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # The answer to the export compliance question every upload otherwise stops to ask. "No
        # non-exempt encryption" is the truthful answer: the recorder is spoken to over plain HTTP, there
        # is no TLS anywhere, and nothing here encrypts anything of its own. zlib is compression.
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: 自宅のレコーダーを見つけて、番組表と録画予約をやりとりします。
        # the overnight guide refresh; the identifier has to be listed for BGTaskScheduler to accept it
        UIBackgroundModes:
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - jp.hiroaki.bdbridge.guideRefresh

  # Only the App Store screenshots live here, and they skip themselves unless BDBRIDGE_SHOTS is set. See
  # app/scripts/screenshots.
  BDBridgeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BDBridgeUITests
    dependencies:
      - target: BDBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.hiroaki.bdbridge.uitests
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig

# Spelled out rather than left to Xcode, so that `xcodebuild test -only-testing:BDBridgeUITests` finds the
# tests through the same scheme Xcode Cloud archives.
schemes:
  BDBridge:
    build:
      targets:
        BDBridge: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BDBridgeUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
