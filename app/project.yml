# XcodeGen definition for the iOS app. The project file itself is generated and not committed:
#   brew install xcodegen && cd app && xcodegen generate
#
# The app is called BD Bridge. The Xcode target keeps its original name, RecorderApp, because the scheme and
# the archive paths are wired to it; only the display name and the bundle identifier below face the reader.
name: RecorderApp
options:
  bundleIdPrefix: jp.hiroaki
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  RecorderKit:
    path: RecorderKit

targets:
  RecorderApp:
    type: application
    platform: iOS
    sources:
      - path: RecorderApp
    dependencies:
      - package: RecorderKit
        product: RecorderKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.hiroaki.bdbridge
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM lives here and not above, because a build setting outranks an xcconfig:
    # Signing.xcconfig reads the gitignored Signing.local.xcconfig, which holds the team identifier.
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    info:
      path: RecorderApp/Info.plist
      properties:
        CFBundleDisplayName: BD Bridge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The recorder is reached over plain HTTP on the LAN, and nowhere else.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # The answer to the export compliance question every upload otherwise stops to ask. "No
        # non-exempt encryption" is the truthful answer: the recorder is spoken to over plain HTTP, there
        # is no TLS anywhere, and nothing here encrypts anything of its own. zlib is compression.
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: 自宅のレコーダーを見つけて、番組表と録画予約をやりとりします。
        # the overnight guide refresh; the identifier has to be listed for BGTaskScheduler to accept it
        UIBackgroundModes:
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - jp.hiroaki.bdbridge.guideRefresh
