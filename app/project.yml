# XcodeGen definition for the iOS app. The project file itself is generated and not committed:
#   brew install xcodegen && cd app && xcodegen generate
#
# The product name and bundle identifier below are working values. The store name has not been decided yet;
# when it is, change CFBundleDisplayName and PRODUCT_BUNDLE_IDENTIFIER here and regenerate.
name: RecorderApp
options:
  bundleIdPrefix: io.github.hiroaki0923
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  RecorderKit:
    path: RecorderKit

targets:
  RecorderApp:
    type: application
    platform: iOS
    sources:
      - path: RecorderApp
    dependencies:
      - package: RecorderKit
        product: RecorderKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hiroaki0923.recorderapp
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM lives here and not above, because a build setting outranks an xcconfig:
    # Signing.xcconfig reads the gitignored Signing.local.xcconfig, which holds the team identifier.
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    info:
      path: RecorderApp/Info.plist
      properties:
        CFBundleDisplayName: 番組表
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The recorder is reached over plain HTTP on the LAN, and nowhere else.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: 自宅のレコーダーを見つけて、番組表と録画予約をやりとりします。
        # the overnight guide refresh; the identifier has to be listed for BGTaskScheduler to accept it
        UIBackgroundModes:
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - io.github.hiroaki0923.recorderapp.guideRefresh
